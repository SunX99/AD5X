[include printer.base.cfg]

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB1
microsteps: 16
rotation_distance: 40
endstop_pin: !eboard:PA15
position_endstop: 220
position_max: 230
position_min: -20
homing_speed: 50
homing_retract_dist: 10
homing_retract_speed: 25
#homing_positive_dir: false


[stepper_y]                
step_pin: PC4              
dir_pin: PA7               
enable_pin: !PA2           
microsteps: 16             
rotation_distance: 40      
endstop_pin: !PC12   
position_endstop: 220
position_max: 230    
position_min: -20    
homing_speed: 50     
homing_retract_dist: 10
homing_retract_speed: 25
#homing_positive_dir: false

[stepper_z]
step_pin: PC7
dir_pin: PC8
enable_pin: !PB14
microsteps: 16
rotation_distance: 8
endstop_pin: PD2
position_endstop: 220
position_max: 230
position_min: -10
homing_speed:20
#homing_positive_dir: false 
homing_retract_dist: 5  
homing_retract_speed: 10

[extruder]
step_pin: eboard:PB14
dir_pin: !eboard:PB15
enable_pin: !eboard:PB12
microsteps: 16
rotation_distance: 4.7
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: eboard:PA8
sensor_type: Generic 3950
sensor_pin: eboard:PA0
#control: pid
#pid_Kp: 20.109
#pid_Ki: 1.943
#pid_Kd: 52.031
min_temp: -270
max_temp: 350
min_extrude_temp: 100
pressure_advance:0.04
pressure_advance_smooth_time: 0.040
max_extrude_only_distance:1500.00
max_extrude_cross_section:1000

[verify_heater extruder]
max_error: 290
check_gain_time:200
hysteresis: 10
heating_gain: 10

[tmc2209 stepper_x]              
uart_pin: PB11                   
interpolate:True                 
run_current: 0.9                 
hold_current:0.9                 
sense_resistor:0.10              
#stealthchop_threshold: 12000  

[tmc2209 stepper_y]             
uart_pin: PB0                   
interpolate:True                
run_current: 0.9                
hold_current:0.9                
sense_resistor:0.10             
#stealthchop_threshold: 12000 

[tmc2209 stepper_z]
uart_pin: PB15
interpolate:True
run_current: 0.6
hold_current:0.6
sense_resistor:0.10
#stealthchop_threshold: 12000

[tmc2209 extruder]
uart_pin: eboard:PB10
interpolate:True
run_current: 0.8
hold_current:0.8
sense_resistor:0.10
#stealthchop_threshold: 999999



[input_shaper]
#shaper_type_x: mzv
#shaper_freq_x: 47.4
#shaper_type_y: mzv
#shaper_freq_y: 46.2

